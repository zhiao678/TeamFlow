spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RECRUITMENT_DB_URL:jdbc:mysql://localhost:3306/teamflow_recruitment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

teamflow:
  security:
    jwt-secret: ${JWT_SECRET:teamflow-development-secret-key-change-me-please}
    token-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
