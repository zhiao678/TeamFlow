spring:
  application:
    name: backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/teamflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.teamflow.backend.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

teamflow:
  security:
    jwt-secret: ${JWT_SECRET:teamflow-development-secret-key-change-me-please}
    token-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
