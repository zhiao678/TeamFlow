spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:teamflow_recruitment_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:recruitment-test-schema.sql
      data-locations: classpath:recruitment-test-data.sql

teamflow:
  security:
    jwt-secret: test-secret-key-that-is-at-least-32-bytes-long
    token-expiration-hours: 24
